<svg viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .main-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 64px;
        font-weight: bold;
        fill: #00f0ff;
        letter-spacing: 8px;
      }
      
      .glitch-1 {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 64px;
        font-weight: bold;
        fill: #ff0040;
        letter-spacing: 8px;
        opacity: 0.8;
        animation: glitch1 3s infinite;
      }
      
      .glitch-2 {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 64px;
        font-weight: bold;
        fill: #00ff41;
        letter-spacing: 8px;
        opacity: 0.8;
        animation: glitch2 3s infinite;
      }
      
      .scanline {
        fill: rgba(0, 240, 255, 0.03);
        animation: scanmove 4s linear infinite;
      }
      
      .blink-cursor {
        fill: #00f0ff;
        animation: blink 1s step-end infinite;
      }
      
      .subtitle {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 16px;
        fill: #00f0ff;
        opacity: 0.7;
        letter-spacing: 4px;
      }
      
      .bracket {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 64px;
        font-weight: bold;
        fill: #00f0ff;
        opacity: 0.3;
        animation: bracketPulse 2s ease-in-out infinite;
      }
      
      .decorLine {
        stroke: #00f0ff;
        stroke-width: 1;
        opacity: 0.2;
        animation: lineScan 3s ease-in-out infinite;
      }

      @keyframes glitch1 {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
        91% { transform: translate(-3px, -2px); opacity: 0.8; }
        92% { transform: translate(3px, 1px); opacity: 0.6; }
        93% { transform: translate(-2px, 3px); opacity: 0.8; }
        94% { transform: translate(0, 0); opacity: 0; }
        95% { transform: translate(4px, -1px); opacity: 0.7; }
        96% { transform: translate(-1px, 2px); opacity: 0.8; }
        97% { transform: translate(0, 0); opacity: 0; }
      }
      
      @keyframes glitch2 {
        0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
        89% { transform: translate(2px, 3px); opacity: 0.6; }
        90% { transform: translate(-4px, -1px); opacity: 0.8; }
        91% { transform: translate(1px, -2px); opacity: 0.7; }
        92% { transform: translate(0, 0); opacity: 0; }
        93% { transform: translate(-3px, 2px); opacity: 0.6; }
        94% { transform: translate(2px, -3px); opacity: 0.8; }
        95% { transform: translate(0, 0); opacity: 0; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes scanmove {
        0% { transform: translateY(-120px); }
        100% { transform: translateY(120px); }
      }
      
      @keyframes bracketPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      
      @keyframes lineScan {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.4; }
      }
    </style>
    
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="noisy"/>
      <feComponentTransfer in="noisy">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="120" fill="transparent"/>
  
  <!-- Decorative scan lines -->
  <line class="decorLine" x1="0" y1="20" x2="120" y2="20"/>
  <line class="decorLine" x1="680" y1="20" x2="800" y2="20" style="animation-delay: 1s;"/>
  <line class="decorLine" x1="0" y1="100" x2="100" y2="100" style="animation-delay: 0.5s;"/>
  <line class="decorLine" x1="700" y1="100" x2="800" y2="100" style="animation-delay: 1.5s;"/>
  
  <!-- Scanline overlay -->
  <rect class="scanline" x="0" y="0" width="800" height="8" rx="0"/>
  
  <!-- Brackets -->
  <text class="bracket" x="50" y="72">{</text>
  <text class="bracket" x="700" y="72">}</text>
  
  <!-- Glitch layers -->
  <text class="glitch-1" x="120" y="70" filter="url(#noise)">ARITZ RIVAS</text>
  <text class="glitch-2" x="120" y="70">ARITZ RIVAS</text>
  
  <!-- Main text -->
  <text class="main-text" x="120" y="70" filter="url(#glow)">ARITZ RIVAS</text>
  
  <!-- Blinking cursor -->
  <rect class="blink-cursor" x="660" y="45" width="3" height="35" rx="1"/>
  
  <!-- Subtitle -->
  <text class="subtitle" x="170" y="100">// SYSTEM.BREACH" DETECTED_</text>
</svg>