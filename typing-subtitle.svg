<svg viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .typing-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 18px;
        fill: #00f0ff;
        letter-spacing: 2px;
      }
      
      .typing-cursor {
        fill: #00f0ff;
        animation: cursorBlink 0.8s step-end infinite;
      }
      
      .typing-mask {
        fill: transparent;
        animation: reveal 4s steps(40) forwards;
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes reveal {
        from { width: 600px; }
        to { width: 0px; }
      }
    </style>
  </defs>
  
  <rect width="600" height="40" fill="transparent"/>
  
  <text class="typing-text" x="10" y="26">$ access_granted → Full Stack Developer | Ethical Hacker</text>
  
  <!-- Mask that reveals text -->
  <rect class="typing-mask" x="10" y="5" height="35"/>
  
  <!-- Cursor -->
  <rect class="typing-cursor" x="580" y="10" width="2" height="22"/>
</svg>